name: selfhost

services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: sh-it-tools
    restart: unless-stopped
    ports: ["8081:80"]

  memos:
    image: neosmemo/memos:stable
    container_name: sh-memos
    restart: unless-stopped
    volumes: ["./data/memos:/var/opt/memos"]
    ports: ["5230:5230"]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: sh-uptime-kuma
    restart: unless-stopped
    volumes: ["./data/uptime-kuma:/app/data"]
    ports: ["3301:3001"]

  searxng:
    image: searxng/searxng:latest
    container_name: sh-searxng
    restart: unless-stopped
    volumes: ["./data/searxng:/etc/searxng"]
    environment:
      - SEARXNG_BASE_URL=https://search.sgyyyds.qzz.io/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    depends_on: [searxng-valkey]
    ports: ["8888:8080"]

  searxng-valkey:
    image: valkey/valkey:8-alpine
    container_name: sh-searxng-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    volumes: ["./data/valkey:/data"]

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: sh-filebrowser
    restart: unless-stopped
    volumes:
      - "./data/filebrowser/srv:/srv"
      - "./data/filebrowser/db:/database"
    environment:
      - FB_BASEURL=/
    ports: ["8082:80"]

  freshrss:
    image: freshrss/freshrss:latest
    container_name: sh-freshrss
    restart: unless-stopped
    volumes: ["./data/freshrss:/var/www/FreshRSS/data"]
    environment:
      - TZ=Asia/Shanghai
      - CRON_MIN=1,31
    ports: ["8083:80"]

  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: sh-excalidraw
    restart: unless-stopped
    ports: ["8084:80"]

  navidrome:
    image: deluan/navidrome:latest
    container_name: sh-navidrome
    restart: unless-stopped
    volumes:
      - "./data/navidrome:/data"
      - "./data/music:/music:ro"
    environment:
      - ND_SCANSCHEDULE=1h
      # 2026-10-23: the first-admin page is closed once an admin exists; keep signup off so it can never reopen.
      - ND_ENABLESIGNUP=false
    ports: ["4533:4533"]

  ttyd:
    image: tsl0922/ttyd:latest
    container_name: sh-ttyd
    restart: unless-stopped
    # 2026-10-23: ttyd is a writable bash shell, and the tunnel does expose it (term.* -> localhost:7681),
    # so basic auth is the only door. `:?` keeps it from ever starting with the old "admin:changeme" default.
    command: ["ttyd", "-p", "7681", "-W", "-c", "${TTYD_USER:?set TTYD_USER in .env}:${TTYD_PASS:?set TTYD_PASS in .env}", "bash", "-l"]
    ports: ["127.0.0.1:7681:7681"]

  gitea:
    image: gitea/gitea:1
    container_name: sh-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=https://git.sgyyyds.qzz.io/
      - GITEA__server__DOMAIN=git.sgyyyds.qzz.io
      - GITEA__server__SSH_DOMAIN=git.sgyyyds.qzz.io
      - GITEA__server__PROTOCOL=http
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
    volumes:
      - "./data/gitea:/data"
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    ports: ["3300:3000", "2222:22"]

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: sh-homarr
    restart: unless-stopped
    volumes:
      - "./data/homarr/appdata:/appdata"
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET:?set HOMARR_SECRET in .env}
    ports: ["7575:7575"]

  n8n:
    image: n8nio/n8n:latest
    container_name: sh-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=flow.sgyyyds.qzz.io
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://flow.sgyyyds.qzz.io/
      - GENERIC_TIMEZONE=Asia/Shanghai
      - N8N_SECURE_COOKIE=true
    volumes: ["./data/n8n:/home/node/.n8n"]
    ports: ["5678:5678"]

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: sh-stirling-pdf
    restart: unless-stopped
    volumes: ["./data/stirling:/configs"]
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=en_GB,zh_CN
    ports: ["8085:8080"]

  subconverter:
    image: tindy2013/subconverter:latest
    container_name: sh-subconverter
    restart: unless-stopped
    ports: ["25500:25500"]

  shlink:
    image: shlinkio/shlink:stable
    container_name: sh-shlink
    restart: unless-stopped
    environment:
      - DEFAULT_DOMAIN=link.sgyyyds.qzz.io
      - IS_HTTPS_ENABLED=true
      # Empty key => no geolocation; Shlink logs a warning on boot. Set a MaxMind license key to enable it.
      - GEOLITE_LICENSE_KEY=
    volumes: ["./data/shlink:/etc/shlink/data"]
    ports: ["8086:8080"]

  kanboard:
    image: kanboard/kanboard:latest
    container_name: sh-kanboard
    restart: unless-stopped
    volumes: ["./data/kanboard:/var/www/app/data"]
    ports: ["8087:80"]

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: sh-radicale
    restart: unless-stopped
    volumes: ["./data/radicale:/data"]
    ports: ["8088:5232"]

  trilium:
    image: triliumnext/trilium:latest
    container_name: sh-trilium
    restart: unless-stopped
    volumes: ["./data/trilium:/home/node/trilium-data"]
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
    ports: ["8089:8080"]

  miniflux:
    image: miniflux/miniflux:latest
    container_name: sh-miniflux
    restart: unless-stopped
    depends_on: [miniflux-db]
    environment:
      - DATABASE_URL=postgres://miniflux:${MINIFLUX_DB_PASS:?set MINIFLUX_DB_PASS in .env}@miniflux-db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${MINIFLUX_USER:-admin}
      - ADMIN_PASSWORD=${MINIFLUX_PASS:?set MINIFLUX_PASS in .env}
      - BASE_URL=https://miniflux.sgyyyds.qzz.io/
    ports: ["8092:8080"]

  miniflux-db:
    image: postgres:16-alpine
    container_name: sh-miniflux-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=${MINIFLUX_DB_PASS:?set MINIFLUX_DB_PASS in .env}
      - POSTGRES_DB=miniflux
    volumes: ["./data/miniflux-db:/var/lib/postgresql/data"]

  focalboard:
    image: mattermost/focalboard:latest
    container_name: sh-focalboard
    restart: unless-stopped
    # 2026-10-24: this image reads no auth env vars at all — nothing we put here would
    # change who can log in. The owner account (see FOCALBOARD_ADMIN_USER/PASS in .env) and
    # the signup token both live in data/focalboard/focalboard.db, so the DB file IS the
    # credential store; keep it out of world-readable hands and back it up before edits.
    # Signup is only closed because a user already exists: POST /api/v2/register without a
    # token 401s ("no sign-up token and user(s) already exist"). Anyone holding the DB's
    # signup_token can still create an account, so rotate it (admin session -> POST
    # /api/v2/teams/0/regenerate_signup_token) whenever it may have leaked.
    volumes: ["./data/focalboard:/opt/focalboard/data"]
    ports: ["8091:8000"]

  ddns-go:
    image: jeessy/ddns-go:latest
    container_name: sh-ddns-go
    restart: unless-stopped
    volumes: ["./data/ddns-go:/root"]
    ports: ["8093:9876"]

  aria2:
    image: hurlenko/aria2-ariang:latest
    container_name: sh-aria2
    restart: unless-stopped
    # The image keeps aria2.conf in an anonymous named volume and re-copies its own default
    # every time the container is recreated. That default has no trailing newline, so the
    # RPC_SECRET start.sh appends gets glued onto the bt-tracker line and aria2 ends up
    # running with *no* rpc-secret at all (verified: unauthenticated addUri worked). The conf
    # is therefore bound from ./data/aria2-conf (gitignored), seeded once from aria2/conf/aria2.conf.example,
    # start.sh rewrites that bound conf with the secret, which is why it must not be a tracked path.
    # No `command:` override here: the image CMD is --conf-path=/aria2/conf/aria2.conf, and replacing
    # it leaves aria2c with no conf and no download URLs ("Specify at least one URL").
    volumes:
      - "./data/aria2:/aria2/data"
      - "./data/aria2-conf:/aria2/conf"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - RPC_SECRET=${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET in .env}
      - EMBED_RPC_SECRET=1
    ports: ["8094:8080"]

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: sh-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
    volumes:
      - "./data/qbittorrent:/config"
      - "./data/downloads:/downloads"
    ports: ["8095:8080", "6881:6881", "6881:6881/udp"]

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: sh-syncthing
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - "./data/syncthing:/config"
      - "./data/sync:/data"
    ports: ["8096:8384"]

  vikunja:
    image: vikunja/vikunja:latest
    container_name: sh-vikunja
    restart: unless-stopped
    environment:
      - VIKUNJA_SERVICE_PUBLICURL=https://todo.sgyyyds.qzz.io/
      # 2026-10-23: an anonymous visitor could register an account on the public hostname.
      # This is the key this build honours — with it false, POST /api/v1/register itself 404s.
      # (VIKUNJA_AUTH_LOCAL_REGISTRATION_ENABLED, the newer spelling, does nothing in 2.7.0.)
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=false
      - VIKUNJA_DATABASE_PATH=/db/vikunja.db
      - VIKUNJA_DATABASE_TYPE=sqlite
    volumes:
      - "./data/vikunja/files:/app/vikunja/files"
      - "./data/vikunja/db:/db"
    ports: ["8097:3456"]

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: sh-jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - "./data/jellyfin/config:/config"
      - "./data/jellyfin/cache:/cache"
      - "./data/media:/media"
    ports: ["8098:8096"]

  joplin:
    image: joplin/server:latest
    container_name: sh-joplin
    restart: unless-stopped
    depends_on: [joplin-db]
    environment:
      - APP_BASE_URL=https://joplin.sgyyyds.qzz.io
      - APP_PORT=22300
      - DB_CLIENT=pg
      - POSTGRES_HOST=joplin-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=joplin
      - POSTGRES_USER=joplin
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASS:?set JOPLIN_DB_PASS in .env}
    ports: ["8099:22300"]

  joplin-db:
    image: postgres:16-alpine
    container_name: sh-joplin-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=joplin
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASS:?set JOPLIN_DB_PASS in .env}
      - POSTGRES_DB=joplin
    volumes: ["./data/joplin-db:/var/lib/postgresql/data"]
